<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استوديو النشرة الذكي — قسم اللغة العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&family=Rakkas&family=Lalezar&family=El+Messiri:wght@400;600;700&family=Markazi+Text:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --font-display: 'El Messiri'; --font-body: 'Tajawal';
    --navy:#0E2444; --navy-2:#12329B; --navy-3:#081B45;
    --gold:#A22A27; --gold-light:#E7ABA7; --gold-dim:#8C2422;
    --paper:#F3ECDA; --paper-2:#EDE4CC; --ink:#201C15;
    --burgundy:#6E2135; --burgundy-2:#8C2C44;
    --sage:#445443; --sage-2:#5C7256;
    --line: rgba(14,36,68,.16);
    --shadow: 0 18px 40px -20px rgba(14,36,68,.35);
    --accent: var(--navy); --accent-2: var(--gold);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body),sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(18,50,155,.05), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(14,36,68,.04), transparent 45%);
  }
  ::selection{background:var(--gold-light);color:var(--navy-3);}
  h1,h2,h3,h4{margin:0;font-family:var(--font-display),serif;font-weight:700;}
  p{margin:0;line-height:1.9;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:var(--font-body),sans-serif;}
  .eyebrow{font-family:'Cairo',sans-serif;font-weight:700;letter-spacing:.14em;font-size:.72rem;text-transform:uppercase;color:var(--gold-dim);}

  /* ===== App shell ===== */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:#fff; padding:14px 28px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 6px 20px -8px rgba(0,0,0,.4);
  }
  .brandmark{display:flex;align-items:center;gap:12px;}
  .brandmark .glyph{
    background:#fff;border-radius:6px;padding:5px 9px;display:flex;align-items:center;
    box-shadow:0 3px 10px -3px rgba(0,0,0,.35);
  }
  .brandmark .glyph img{height:30px;display:block;}
  .brandmark .txt h1{font-size:1.15rem;color:#fff;letter-spacing:.02em;}
  .brandmark .txt span{display:block;font-family:'Cairo',sans-serif;font-size:.65rem;letter-spacing:.16em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:2px;}
  .topbar nav{display:flex;gap:6px;}
  .topbar nav button{
    background:transparent;border:1px solid transparent;color:rgba(255,255,255,.75);
    padding:8px 14px;border-radius:999px;font-size:.85rem;transition:.2s;
  }
  .topbar nav button.active, .topbar nav button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff;}
  .roleChip{font-family:'Cairo',sans-serif;font-size:.7rem;background:rgba(162,42,39,.18);border:1px solid rgba(231,171,167,.45);color:var(--gold-light);padding:5px 12px;border-radius:999px;}

  main{flex:1;width:100%;}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 90px;}

  /* ===== Login ===== */
  .loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, rgba(162,42,39,.08), transparent 55%),
      linear-gradient(180deg,var(--navy-3), var(--navy) 60%, var(--navy-2));
    position:relative;overflow:hidden;
  }
  .loginScreen::before{
    content:"";position:absolute;width:min(70vw,900px);aspect-ratio:177/246;left:50%;top:50%;
    transform:translate(-50%,-50%);background-image:var(--wm-url);background-size:contain;background-repeat:no-repeat;background-position:center;
    opacity:.07;pointer-events:none;
  }
  .loginCard{
    position:relative;z-index:2;width:min(420px,92vw);background:rgba(243,236,218,.98);
    padding:44px 34px;border-radius:4px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
    border-top:3px solid var(--gold);
    animation:riseIn .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .loginCard .glyphBig{
    width:72px;height:72px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  }
  .loginCard .glyphBig img{max-width:100%;max-height:100%;}
  .loginCard h2{text-align:center;font-size:1.5rem;color:var(--navy);}
  .loginCard .sub{text-align:center;color:#665;font-size:.85rem;margin-top:6px;font-family:'Cairo',sans-serif;}
  .field{margin-top:18px;}
  .field label{display:block;font-family:'Cairo',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--navy);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:2px;background:#fff;
    font-size:.92rem;color:var(--ink);outline:none;transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(162,42,39,.15);}
  .roleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .roleGrid button{
    padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:.78rem;
    font-family:'Cairo',sans-serif;color:#555;transition:.15s;
  }
  .roleGrid button.sel{border-color:var(--navy);background:var(--navy);color:#fff;}
  .btnPrimary{
    margin-top:24px;width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:2px;
    font-family:'Cairo',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.03em;transition:.2s;
  }
  .btnPrimary:hover{background:var(--navy-2);}
  .loginNote{margin-top:16px;text-align:center;font-size:.72rem;color:#887;font-family:'Cairo',sans-serif;}

  /* ===== Dashboard ===== */
  .sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .sectionHead h2{font-size:1.6rem;color:var(--navy);}
  .statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:34px;}
  .statCard{
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px 20px 16px;position:relative;overflow:hidden;
    box-shadow:var(--shadow);
  }
  .statCard::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--gold);}
  .statCard .k{font-family:'Cairo',sans-serif;font-size:.7rem;letter-spacing:.08em;color:#887;text-transform:uppercase;}
  .statCard .v{font-family:var(--font-display),serif;font-size:1.9rem;color:var(--navy);margin-top:4px;}
  .statCard .d{font-size:.78rem;color:#998;margin-top:2px;}

  .panel{background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);padding:26px;margin-bottom:22px;}
  .panel h3{font-size:1.15rem;color:var(--navy);margin-bottom:14px;}
  .issueRow{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);}
  .issueRow:last-child{border-bottom:none;}
  .issueRow .meta{display:flex;align-items:center;gap:12px;}
  .issueRow .badge{
    width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-weight:700;font-size:.85rem;
  }
  .issueRow .txt strong{display:block;font-size:.95rem;color:var(--navy);}
  .issueRow .txt span{font-size:.75rem;color:#887;font-family:'Cairo',sans-serif;}
  .miniBtn{
    background:transparent;border:1px solid var(--navy);color:var(--navy);padding:6px 14px;border-radius:999px;
    font-size:.76rem;font-family:'Cairo',sans-serif;transition:.15s;
  }
  .miniBtn:hover{background:var(--navy);color:#fff;}
  .emptyState{text-align:center;padding:40px 20px;color:#998;font-family:'Cairo',sans-serif;font-size:.85rem;}

  .ctaBanner{
    background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:4px;
    padding:30px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .ctaBanner::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(162,42,39,.14);}
  .ctaBanner h3{color:#fff;font-size:1.4rem;position:relative;}
  .ctaBanner p{color:rgba(255,255,255,.7);font-size:.85rem;margin-top:6px;position:relative;max-width:460px;}
  .ctaBanner button{position:relative;background:var(--gold);color:var(--navy-3);border:none;padding:13px 26px;border-radius:2px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.9rem;white-space:nowrap;}
  .ctaBanner button:hover{background:var(--gold-light);}

  /* ===== Wizard ===== */
  .wizardShell{max-width:760px;margin:0 auto;}
  .stepTrack{display:flex;justify-content:space-between;margin-bottom:30px;position:relative;}
  .stepTrack::before{content:"";position:absolute;top:13px;inset-inline-start:0;right:0;left:0;height:1px;background:var(--line);}
  .stepDot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .stepDot i{
    width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-style:normal;font-family:'Cairo',sans-serif;font-size:.72rem;color:#aaa;font-weight:700;
  }
  .stepDot.done i{background:var(--navy);border-color:var(--navy);color:var(--gold-light);}
  .stepDot.now i{background:var(--gold);border-color:var(--gold);color:var(--navy-3);}
  .stepDot span{font-size:.62rem;font-family:'Cairo',sans-serif;color:#998;text-align:center;max-width:70px;}

  .wStep{background:#fff;border:1px solid var(--line);border-radius:4px;padding:30px;box-shadow:var(--shadow);}
  .wStep h3{font-size:1.3rem;color:var(--navy);}
  .wStep .hint{font-family:'Cairo',sans-serif;font-size:.8rem;color:#887;margin-top:6px;margin-bottom:22px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}

  .listBuilder .rowItem{
    display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;background:var(--paper);padding:10px;border-radius:2px;border:1px solid var(--line);
  }
  .rowItem textarea, .rowItem input{flex:1;border:1px solid var(--line);}
  .xBtn{
    background:#fff;border:1px solid var(--line);color:#a55;width:30px;height:30px;border-radius:2px;flex:none;font-size:.9rem;
  }
  .addBtn{
    margin-top:6px;background:transparent;border:1px dashed var(--gold-dim);color:var(--gold-dim);padding:9px 16px;
    border-radius:2px;font-family:'Cairo',sans-serif;font-size:.78rem;font-weight:700;
  }
  .addBtn:hover{background:rgba(162,42,39,.08);}

  .personBlock{border:1px solid var(--line);border-radius:2px;padding:16px;background:var(--paper);margin-bottom:14px;}
  .personBlock .grid2{margin-bottom:0;}
  .imgPick{
    display:flex;align-items:center;gap:12px;margin-top:10px;
  }
  .imgPick .prev{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#ddd;flex:none;}
  .imgPick .prev img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .imgPick .prev.none{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:.65rem;font-family:'Cairo',sans-serif;text-align:center;}
  .fileLabel{
    border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:2px;font-size:.76rem;color:#556;font-family:'Cairo',sans-serif;
  }
  .fileLabel input{display:none;}

  .chipToggle{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chipToggle button{
    padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.78rem;
    font-family:'Cairo',sans-serif;color:#556;transition:.15s;
  }
  .chipToggle button.sel{background:var(--sage);border-color:var(--sage);color:#fff;}

  .wNav{display:flex;justify-content:space-between;margin-top:22px;}
  .btnGhost{background:transparent;border:1px solid var(--line);color:#556;padding:11px 22px;border-radius:2px;font-family:'Cairo',sans-serif;font-size:.85rem;}
  .btnGold{background:var(--navy);color:#fff;border:none;padding:11px 26px;border-radius:2px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.85rem;}
  .btnGold:hover{background:var(--navy-2);}
  .btnGold.final{background:var(--gold);color:var(--navy-3);}
  .btnGold.final:hover{background:var(--gold-light);}

  /* ===== Generating overlay ===== */
  .genOverlay{
    position:fixed;inset:0;background:linear-gradient(180deg,var(--navy-3),var(--navy));z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;
  }
  .genOverlay .ring{width:78px;height:78px;border-radius:50%;border:2px solid rgba(231,171,167,.3);border-top-color:var(--gold);animation:spin 1.1s linear infinite;margin-bottom:26px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .genOverlay .msg{font-family:'Cairo',sans-serif;font-size:.95rem;color:rgba(255,255,255,.85);min-height:1.4em;}
  .genOverlay .sub{margin-top:10px;font-size:.72rem;color:rgba(255,255,255,.4);font-family:'Cairo',sans-serif;letter-spacing:.05em;}

  /* ===== Magazine viewer ===== */
  .magazine{background:var(--paper);}
  .magToolbar{
    position:sticky;top:63px;z-index:40;background:rgba(243,236,218,.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .magToolbar .id{font-family:'Cairo',sans-serif;font-size:.75rem;color:#887;}
  .magToolbar .acts{display:flex;gap:8px;}

  .cover{
    position:relative;min-height:78vh;display:flex;flex-direction:column;justify-content:flex-end;
    padding:60px 8vw 70px;overflow:hidden;color:#fff;
    background:linear-gradient(180deg, var(--accent-3, var(--navy-3)) 0%, var(--accent, var(--navy)) 60%, var(--accent-2b, var(--navy-2)) 100%);
  }
  .cover .wm{
    position:absolute;width:min(46vw,560px);aspect-ratio:177/246;
    background-image:var(--wm-url);background-size:contain;background-repeat:no-repeat;background-position:center;
    top:50%;left:50%;transform:translate(-50%,-46%);opacity:.08;pointer-events:none;
  }
  .cover .identityStrip{
    display:flex;gap:10px;align-items:center;font-family:'Cairo',sans-serif;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:22px;flex-wrap:wrap;
  }
  .cover .identityStrip .chip{border:1px solid rgba(231,171,167,.5);color:var(--gold-light);padding:4px 12px;border-radius:999px;}
  .cover .kicker{font-family:'Cairo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-light);font-size:.8rem;margin-bottom:14px;}
  .cover h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.18;max-width:820px;}
  .cover .subhead{margin-top:18px;max-width:560px;font-size:1.05rem;color:rgba(255,255,255,.82);}
  .cover .pullQuote{margin-top:30px;font-family:var(--font-display),serif;font-size:1.3rem;color:var(--gold-light);border-inline-start:3px solid var(--gold);padding-inline-start:16px;max-width:520px;}

  .section{padding:64px 8vw;position:relative;}
  .section .eyebrowRow{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .section .eyebrowRow .num{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:.62rem;color:#fff;
    width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold) 49%, var(--navy-2) 51%, var(--navy-2) 100%);
    box-shadow:0 3px 8px -3px rgba(14,36,68,.4);
  }
  .section h2{font-size:clamp(1.6rem,3vw,2.3rem);color:var(--navy);}

  .lead{font-size:1.02rem;color:#443;max-width:70ch;}
  .lead .drop{float:right;font-family:var(--font-display),serif;font-size:3.4rem;line-height:.8;color:var(--gold);margin-inline-start:8px;margin-top:4px;}

  .splitBlock{display:grid;grid-template-columns:1fr 1.15fr;gap:44px;align-items:center;}
  .splitBlock.rev{direction:ltr;}
  .splitBlock.rev > *{direction:rtl;}
  @media(max-width:720px){.splitBlock{grid-template-columns:1fr;}}
  .mediaFrame{
    aspect-ratio:4/3;border-radius:3px;overflow:hidden;position:relative;background:var(--navy);box-shadow:var(--shadow);
  }
  .mediaFrame img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.03);}
  .mediaFrame .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);font-family:'Cairo',sans-serif;font-size:.75rem;background:repeating-linear-gradient(135deg,var(--navy),var(--navy) 10px,var(--navy-2) 10px,var(--navy-2) 20px);}
  .mediaFrame .capline{position:absolute;bottom:0;inset-inline:0;background:linear-gradient(0deg,rgba(9,24,46,.85),transparent);color:#fff;padding:14px 12px 8px;font-family:'Cairo',sans-serif;font-size:.7rem;}

  .cardsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:var(--shadow);transition:.25s;}
  .card:hover{transform:translateY(-4px);}
  .card .cph{height:150px;background:var(--navy-2);position:relative;overflow:hidden;}
  .card .cph img{width:100%;height:100%;object-fit:cover;}
  .card .cbody{padding:16px 17px 20px;}
  .card .cbody h4{font-size:1.02rem;color:var(--navy);margin-bottom:6px;line-height:1.5;}
  .card .cbody p{font-size:.83rem;color:#665;}
  .card .tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:var(--navy-3);font-family:'Cairo',sans-serif;font-size:.62rem;font-weight:700;padding:3px 10px;border-radius:999px;}

  .timeline{position:relative;padding-inline-start:26px;}
  .timeline::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:1.5px;background:var(--line);}
  .tItem{position:relative;padding-bottom:26px;}
  .tItem::before{content:"";position:absolute;inset-inline-start:-26px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--gold);}
  .tItem h4{font-size:1rem;color:var(--navy);margin-bottom:4px;}
  .tItem p{font-size:.85rem;color:#665;}

  .spotlight{
    display:grid;grid-template-columns:280px 1fr;gap:40px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:4px;padding:36px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  @media(max-width:680px){.spotlight{grid-template-columns:1fr;}}
  .spotlight::before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(162,42,39,.09);}
  .spotlight .frame{aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:var(--shadow);}
  .spotlight .frame img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .spotlight .frame .ph{width:100%;height:100%;background:var(--navy-2);}
  .spotlight .nameplate{font-family:'Cairo',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:8px;}
  .spotlight h3{font-size:1.7rem;color:var(--navy);margin-bottom:10px;}

  .quoteInter{
    background:var(--navy);color:#fff;padding:80px 10vw;text-align:center;position:relative;overflow:hidden;
  }
  .quoteInter .wm2{position:absolute;font-family:var(--font-display),serif;font-size:12rem;color:rgba(255,255,255,.04);top:-20px;left:50%;transform:translateX(-50%);}
  .quoteInter q{font-family:var(--font-display),serif;font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.6;color:var(--gold-light);quotes:none;position:relative;}
  .quoteInter .attr{margin-top:20px;font-family:'Cairo',sans-serif;font-size:.8rem;color:rgba(255,255,255,.55);}

  .factStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
  .factCard{border:1px solid var(--line);border-radius:3px;padding:20px;background:#fff;}
  .factCard .fi{font-family:var(--font-display),serif;font-size:1.6rem;color:var(--gold);margin-bottom:8px;}
  .factCard h4{font-size:1rem;color:var(--navy);margin-bottom:6px;}
  .factCard p{font-size:.83rem;color:#665;}

  .mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:120px;gap:10px;}
  .mosaic .m1{grid-column:span 2;grid-row:span 2;}
  .mosaic .mCell{border-radius:3px;overflow:hidden;background:var(--navy-2);position:relative;}
  .mosaic .mCell img{width:100%;height:100%;object-fit:cover;}
  @media(max-width:640px){.mosaic{grid-template-columns:repeat(2,1fr);}}

  .divider{height:1px;background:linear-gradient(90deg,transparent, var(--gold-dim), transparent);margin:0 8vw;opacity:.5;}

  .colophon{padding:50px 8vw 80px;text-align:center;}
  .colophon .glyph{width:auto;height:auto;border:none;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
  .colophon .glyph img{height:34px;opacity:.85;}
  .colophon p{font-family:'Cairo',sans-serif;font-size:.75rem;color:#998;max-width:60ch;margin:0 auto;}
  .designReport{
    margin-top:26px;display:inline-flex;gap:18px;flex-wrap:wrap;justify-content:center;background:#fff;border:1px solid var(--line);
    padding:14px 22px;border-radius:999px;box-shadow:var(--shadow);
  }
  .designReport .dItem{font-family:'Cairo',sans-serif;font-size:.68rem;color:#887;}
  .designReport .dItem b{display:block;color:var(--navy);font-size:.9rem;font-family:var(--font-display),serif;}

  /* Reveal/motion */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.show{opacity:1;transform:translateY(0);}

  /* Archive */
  .archiveGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .archiveCard{background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s;}
  .archiveCard:hover{transform:translateY(-3px);}
  .archiveCard .ah{height:120px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-family:var(--font-display),serif;font-size:1.4rem;text-align:center;padding:10px;}
  .archiveCard .ab{padding:14px 16px 18px;}
  .archiveCard .ab strong{display:block;font-size:.9rem;color:var(--navy);}
  .archiveCard .ab span{font-size:.72rem;color:#998;font-family:'Cairo',sans-serif;}

  /* ===== Bento poster pages (magazine) ===== */
  .pagesWrap{padding:30px 20px 60px;}
  .magPage{
    max-width:1180px;margin:0 auto 34px;background:#fff;border:1px solid var(--line);
    border-radius:5px;box-shadow:var(--shadow);overflow:hidden;position:relative;
  }
  .pageHeader{
    padding:30px 34px 26px;color:#fff;position:relative;overflow:hidden;
  }
  .pageHeader.running{padding:14px 30px;}
  .pageHeader .wmSmall{
    position:absolute;width:170px;aspect-ratio:177/246;background-image:var(--wm-url);
    background-size:contain;background-repeat:no-repeat;opacity:.09;left:-24px;top:-28px;pointer-events:none;
  }
  .pageHeader .mastRow{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .pageHeader .mastBrand{display:flex;align-items:center;gap:10px;}
  .pageHeader .mastBrand .crestChip{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
  .pageHeader .mastBrand .crestChip img{width:100%;height:100%;object-fit:contain;}
  .pageHeader .mastBrand span{font-family:'Cairo',sans-serif;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);}
  .pageHeader .mastMeta{font-family:'Cairo',sans-serif;font-size:.66rem;letter-spacing:.05em;color:rgba(255,255,255,.7);white-space:nowrap;}
  .pageHeader .htxt{position:relative;z-index:1;margin-top:20px;}
  .pageHeader .htxt h1{font-size:clamp(1.7rem,3vw,2.6rem);color:#fff;line-height:1.4;}
  .pageHeader .kicker{font-family:'Cairo',sans-serif;font-size:.68rem;letter-spacing:.1em;color:var(--gold-light);text-transform:uppercase;margin-bottom:8px;}
  .pageHeader .mastRule{height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55) 18%,rgba(255,255,255,.55) 82%,rgba(255,255,255,0));margin-top:18px;position:relative;z-index:1;}
  .pageHeader.running .htxt{margin-top:0;display:flex;align-items:center;}
  .pageHeader.running .htxt h1{font-size:.92rem;font-family:'Cairo',sans-serif;font-weight:700;color:rgba(255,255,255,.92);line-height:1;}
  .pageHeader .pageNum{position:relative;z-index:1;font-family:'Cairo',sans-serif;font-size:.7rem;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap;}

  .feedGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 28px;counter-reset:sectionCounter;align-items:start;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative;box-shadow:0 8px 20px -12px rgba(14,36,68,.25);display:flex;flex-direction:column;grid-column:span 1;}
  .tile.wide{grid-column:1 / -1;}
  .tile .tileImg{width:100%;aspect-ratio:16/10;background:var(--navy-2);overflow:hidden;position:relative;flex:none;}
  .tile .tileImg img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .tileBody{padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
  .tile .tileBody h4{font-size:.95rem;color:var(--navy);line-height:1.5;font-family:var(--font-display),serif;}
  .tile .tileBody p{font-size:.8rem;color:#665;line-height:1.75;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.62rem;background:var(--paper-2);color:var(--navy);padding:4px 11px;border-radius:999px;border:1px solid var(--line);align-self:flex-start;white-space:nowrap;}
  .pill::before{counter-increment:sectionCounter;content:counter(sectionCounter,decimal-leading-zero) " — ";color:var(--gold);}
  .tile.quoteTile .pill::before, .qrBox .pill::before{content:none;}
  .tile .cornerChip{position:absolute;top:8px;inset-inline-start:8px;width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,var(--gold) 50%, var(--navy-2) 50%);z-index:2;box-shadow:0 3px 8px -3px rgba(0,0,0,.4);}

  /* Compact card — small circular thumbnail ONLY when a real photo exists; plain text otherwise */
  .tile.feedRow{padding:0;}
  .tile.feedRow .rowInner{display:flex;align-items:center;gap:12px;padding:13px 15px;}
  .tile.feedRow .thumb{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--gold);background:var(--navy-2);}
  .tile.feedRow .thumb img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .tile.feedRow .tileBody{padding:0;flex:1;min-width:0;gap:3px;}
  .tile.feedRow .tileBody h4{font-size:.88rem;}
  .tile.feedRow .tileBody p{font-size:.76rem;}

  .tile.quoteTile{justify-content:center;align-items:center;text-align:center;background:var(--navy);color:#fff;padding:24px 20px;}
  .tile.quoteTile .bigQ{position:absolute;font-family:var(--font-display),serif;font-size:5rem;color:rgba(255,255,255,.08);top:-10px;right:14px;line-height:1;}
  .tile.quoteTile q{font-family:var(--font-display),serif;font-size:1.05rem;line-height:1.7;color:var(--gold-light);position:relative;quotes:none;}
  .tile.quoteTile .attr{margin-top:10px;font-size:.68rem;color:rgba(255,255,255,.6);font-family:'Cairo',sans-serif;}

  .tile.circlePerson{align-items:center;text-align:center;padding:20px 16px;justify-content:center;}
  .tile.circlePerson .frame{width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:var(--navy-2);flex:none;margin-bottom:10px;}
  .tile.circlePerson .frame img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .tile.circlePerson .personInfo{width:100%;}
  .tile.circlePerson .nm{font-family:'Cairo',sans-serif;font-size:.62rem;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.08em;}
  .tile.circlePerson h4{font-size:1rem;color:var(--navy);margin:4px 0 6px;font-family:var(--font-display),serif;}
  .tile.circlePerson p{font-size:.8rem;color:#665;line-height:1.7;}

  .tile.storyTile{padding:0;}
  .tile.storyTile .sRow{display:flex;gap:14px;align-items:flex-start;padding:8px 16px 16px;flex-wrap:wrap;}
  .tile.storyTile .sImg{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;border:3px solid var(--gold);background:var(--navy-2);}
  .tile.storyTile .sImg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .tile.storyTile .sBody{flex:1;min-width:180px;}
  .tile.storyTile .sBody h4{font-size:.98rem;color:var(--navy);margin-bottom:2px;font-family:var(--font-display),serif;}
  .tile.storyTile .byline{font-family:'Cairo',sans-serif;font-size:.64rem;color:#998;margin-bottom:5px;}
  .tile.storyTile .sBody p{font-size:.82rem;color:#554;line-height:1.8;}
  .tile.storyTile .qrBox{flex:none;text-align:center;}
  .tile.storyTile .qrBox img{width:64px;height:64px;border-radius:4px;border:1px solid var(--line);display:block;}
  .tile.storyTile .qrBox .qrFallback{width:64px;height:64px;border-radius:4px;border:1px solid var(--line);background:var(--paper);align-items:center;justify-content:center;text-align:center;font-size:.6rem;color:var(--navy);text-decoration:none;font-family:'Cairo',sans-serif;line-height:1.4;}
  .tile.storyTile .qrBox span{display:block;font-family:'Cairo',sans-serif;font-size:.58rem;color:#998;margin-top:4px;max-width:72px;}

  .tile.videoTile{padding:0;}
  .videoFrame{position:relative;width:100%;aspect-ratio:16/9;background:var(--navy-2);overflow:hidden;cursor:pointer;}
  .videoPlayBtn{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
    background:rgba(14,36,68,.75);color:#fff;border:2px solid rgba(255,255,255,.85);font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;transition:.2s;padding-inline-start:4px;
  }
  .videoFrame:hover .videoPlayBtn{background:var(--gold);border-color:var(--gold);transform:translate(-50%,-50%) scale(1.08);}

  @media(max-width:720px){
    .feedGrid{grid-template-columns:1fr;}
  }

  .tile.factTile{flex-direction:row;align-items:center;gap:12px;padding:12px 16px;}
  .tile.factTile .fi{font-family:var(--font-display),serif;font-size:1.3rem;color:var(--gold);flex:none;}
  .tile.dottedTile{border:2px dashed var(--gold-dim);background:var(--paper);}

  .editorialTile{padding:18px 20px;}
  .editorialTile .hodRow{display:flex;gap:12px;align-items:center;}
  .editorialTile .hodImg{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--navy-2);}
  .editorialTile .hodImg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .editorialTile .drop{float:right;font-family:var(--font-display),serif;font-size:2.6rem;line-height:.78;color:var(--gold);margin-inline-start:8px;margin-top:4px;}

  .pageFooter{padding:14px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);flex-wrap:wrap;text-align:center;}
  .pageFooter img{height:22px;opacity:.7;}
  .pageFooter span{font-family:'Cairo',sans-serif;font-size:.64rem;color:#998;}

  @media print{
    .topbar,.magToolbar,.wNav{display:none !important;}
    .reveal{opacity:1 !important;transform:none !important;}
    body{background:#fff;}
    .magPage{page-break-after:always;margin:0 0 0;border:none;box-shadow:none;max-width:100%;border-radius:0;}
    .pagesWrap{padding:0;}
  }
</style>

const STORAGE_PREFIX = "arabicmag";

/* ---------- utilities ---------- */
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function hashSeed(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h;}
function pick(arr,seed){return arr[seed % arr.length];}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function compressImage(file, maxW=640, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        // light "AI image engine" normalization: subtle contrast/saturation lift
        ctx.filter = "saturate(1.06) contrast(1.03)";
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- storage ---------- */
async function saveIssue(issue){
  try{
    await window.storage.set(`${STORAGE_PREFIX}:issue:${issue.id}`, JSON.stringify(issue), true);
    const idxRaw = await safeGet(`${STORAGE_PREFIX}:index`);
    const idx = idxRaw ? JSON.parse(idxRaw.value) : [];
    if(!idx.includes(issue.id)) idx.push(issue.id);
    await window.storage.set(`${STORAGE_PREFIX}:index`, JSON.stringify(idx), true);
  }catch(e){ console.error("storage save failed", e); }
}
async function safeGet(key){
  try{ return await window.storage.get(key, true); }catch(e){ return null; }
}
async function loadAllIssues(){
  try{
    const idxRaw = await safeGet(`${STORAGE_PREFIX}:index`);
    if(!idxRaw) return [];
    const idx = JSON.parse(idxRaw.value);
    const out = [];
    for(const id of idx){
      const r = await safeGet(`${STORAGE_PREFIX}:issue:${id}`);
      if(r) out.push(JSON.parse(r.value));
    }
    out.sort((a,b)=> (b.meta.week||0) - (a.meta.week||0));
    return out;
  }catch(e){ return []; }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = "";
  if(DB.view === "login"){ app.appendChild(renderLogin()); return; }
  app.appendChild(renderShell());
}

/* ---------- LOGIN ---------- */
function renderLogin(){
  const wrap = el(`<div class="loginScreen">
    <div class="loginCard">
      <div class="glyphBig"><img src="${SHIELD_SRC}" alt="GEMS Founders School"></div>
      <h2>نشرة قسم اللغة العربية</h2>
      <div class="sub">GFS بالعربي أحلى — GEMS Founders School Dubai</div>
      <button class="btnPrimary" id="visitorBtn">📖 عرض النشرة</button>
      <div style="text-align:center;margin-top:22px;">
        <button id="showAdminBtn" style="background:transparent;border:none;color:#998;font-family:'Cairo',sans-serif;font-size:.76rem;text-decoration:underline;cursor:pointer;">دخول الإدارة</button>
      </div>
      <div id="adminBox" style="display:none;margin-top:14px;">
        <div class="field">
          <label>الرقم السري للإدارة</label>
          <input type="password" id="adminPin" placeholder="••••" inputmode="numeric">
        </div>
        <button class="btnPrimary" id="adminBtn" style="margin-top:14px;">دخول الإدارة</button>
        <div id="pinErr" style="display:none;color:#a55;font-family:'Cairo',sans-serif;font-size:.75rem;margin-top:8px;text-align:center;">رقم سري غير صحيح</div>
      </div>
      <div class="loginNote">الدخول العام لعرض النشرة لا يحتاج رقمًا سريًا — الرقم السري لفريق الإدارة فقط</div>
    </div>
  </div>`);

  wrap.querySelector('#visitorBtn').addEventListener('click', async ()=>{
    DB.role = "visitor";
    const all = await loadAllIssues();
    DB.issues = all.filter(iss => !iss.status || iss.status === 'published');
    if(DB.issues.length){ DB.currentIssue = DB.issues[0]; DB.view = "viewer"; }
    else { DB.view = "archive"; }
    render();
  });

  wrap.querySelector('#showAdminBtn').addEventListener('click', ()=>{
    wrap.querySelector('#adminBox').style.display = 'block';
    wrap.querySelector('#adminPin').focus();
  });

  const tryAdmin = async ()=>{
    const pin = wrap.querySelector('#adminPin').value;
    const stored = await getAdminPin();
    if(pin === stored){
      DB.role = "admin";
      DB.view = "dashboard";
      DB.issues = await loadAllIssues();
      render();
    } else {
      wrap.querySelector('#pinErr').style.display = 'block';
    }
  };
  wrap.querySelector('#adminBtn').addEventListener('click', tryAdmin);
  wrap.querySelector('#adminPin').addEventListener('keydown', e=>{ if(e.key==='Enter') tryAdmin(); });

  return wrap;
}

async function getAdminPin(){
  try{
    const r = await safeGet(`${STORAGE_PREFIX}:admin_pin`);
    return r ? JSON.parse(r.value) : "2580";
  }catch(e){ return "2580"; }
}
async function setAdminPin(newPin){
  await window.storage.set(`${STORAGE_PREFIX}:admin_pin`, JSON.stringify(newPin), true);
}
async function getFontPref(){
  try{
    const r = await safeGet(`${STORAGE_PREFIX}:font_pref`);
    return r ? JSON.parse(r.value) : { display:"El Messiri", body:"Tajawal" };
  }catch(e){ return { display:"El Messiri", body:"Tajawal" }; }
}
async function setFontPref(pref){
  await window.storage.set(`${STORAGE_PREFIX}:font_pref`, JSON.stringify(pref), true);
  applyFontPref(pref);
}
function applyFontPref(pref){
  document.documentElement.style.setProperty('--font-display', `'${pref.display}'`);
  document.documentElement.style.setProperty('--font-body', `'${pref.body}'`);
}

/* ---------- SHELL (topbar + routed view) ---------- */
function renderShell(){
  const isAdmin = DB.role === 'admin';
  const navItems = isAdmin
    ? [{v:'dashboard',label:'الرئيسية'},{v:'wizard',label:'إنشاء نشرة جديدة'},{v:'archive',label:'الأرشيف'},{v:'settings',label:'الإعدادات'}]
    : [{v:'archive',label:'الأعداد السابقة'}];
  const shell = el(`<div style="min-height:100vh;display:flex;flex-direction:column;">
    <div class="topbar">
      <div class="brandmark">
        <div class="glyph"><img src="${LOGO_SRC}" alt="GEMS Founders School"></div>
        <div class="txt"><h1>نشرة قسم اللغة العربية</h1><span>GFS بالعربي أحلى</span></div>
      </div>
      <nav id="topNav">
        ${navItems.map(n=>`<button data-v="${n.v}">${n.label}</button>`).join('')}
      </nav>
      ${isAdmin ? `<button id="testConnBtn" style="background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);padding:7px 14px;border-radius:999px;font-family:'Cairo',sans-serif;font-size:.75rem;margin-inline-end:10px;">اختبار الاتصال</button>` : ''}
      <div class="roleChip">${roleLabel(DB.role)}</div>
      <button id="logoutBtn" style="background:transparent;border:none;color:rgba(255,255,255,.55);font-family:'Cairo',sans-serif;font-size:.72rem;margin-inline-start:10px;text-decoration:underline;cursor:pointer;">خروج</button>
    </div>
    <main id="mainArea"></main>
    <div id="connToast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);transition:transform .3s ease;background:var(--navy-3);color:#fff;padding:14px 22px;border-radius:6px;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);font-family:'Cairo',sans-serif;font-size:.82rem;z-index:500;max-width:90vw;text-align:center;"></div>
  </div>`);
  if(isAdmin) shell.querySelector('#testConnBtn').addEventListener('click', ()=> testConnection(shell));
  shell.querySelector('#logoutBtn').addEventListener('click', ()=>{ DB.role=null; DB.view='login'; render(); });
  shell.querySelector('#topNav').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.v === 'wizard'){ DB.draft = freshDraft(); DB.wizardStep = 0; }
    DB.view = b.dataset.v;
    render();
  });
  const main = shell.querySelector('#mainArea');
  const nav = shell.querySelector('#topNav');
  [...nav.children].forEach(b=> b.classList.toggle('active', b.dataset.v===DB.view || (DB.view==='viewer' && b.dataset.v==='archive')));

  if(DB.view === "dashboard" && isAdmin) main.appendChild(renderDashboard());
  else if(DB.view === "wizard" && isAdmin) main.appendChild(renderWizard());
  else if(DB.view === "settings" && isAdmin) main.appendChild(renderSettings());
  else if(DB.view === "archive") main.appendChild(renderArchive());
  else if(DB.view === "viewer") main.appendChild(renderMagazineViewer(DB.currentIssue));
  else main.appendChild(renderArchive());
  return shell;
}

function roleLabel(r){ return r==='admin' ? 'الإدارة' : 'زائر'; }

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const issues = DB.issues || [];
  const latest = issues[0];
  const totalReaders = issues.reduce((s,i)=> s + (i.stats?.readers||0), 0);
  const wrap = el(`<div class="wrap">
    <div class="sectionHead"><h2>لوحة التحكم</h2><div class="eyebrow">Dashboard</div></div>

    <div class="statGrid">
      <div class="statCard"><div class="k">آخر إصدار</div><div class="v">${latest ? esc(latest.meta.title||('العدد '+latest.meta.week)) : '—'}</div><div class="d">${latest ? 'الأسبوع '+esc(latest.meta.week) : 'لا يوجد إصدار بعد'}</div></div>
      <div class="statCard"><div class="k">عدد القراء</div><div class="v">${totalReaders || 0}</div><div class="d">إجمالي تراكمي (تقديري)</div></div>
      <div class="statCard"><div class="k">أكثر موضوع مشاهدة</div><div class="v" style="font-size:1.1rem;">${latest && latest.ai ? esc(shorten(latest.ai.cover.headline,26)) : '—'}</div><div class="d">من العدد الأخير</div></div>
      <div class="statCard"><div class="k">النشرات السابقة</div><div class="v">${issues.length}</div><div class="d">إصدار محفوظ في الأرشيف</div></div>
    </div>

    <div class="ctaBanner" style="margin-bottom:30px;">
      <div><h3>جاهز لإصدار هذا الأسبوع؟</h3><p>أدخل الأفكار والبيانات فقط — محرك التخطيط التحريري والكتابة والتصميم يتولى الباقي، ويُخرج مجلة مختلفة التصميم في كل مرة.</p></div>
      <button id="ctaNew">إنشاء نشرة جديدة</button>
    </div>

    <div class="panel">
      <h3>النشرات الأخيرة</h3>
      <div id="recentList"></div>
    </div>
  </div>`);
  wrap.querySelector('#ctaNew').addEventListener('click', ()=>{ DB.draft = freshDraft(); DB.wizardStep=0; DB.view='wizard'; render(); });
  const list = wrap.querySelector('#recentList');
  if(!issues.length){
    list.appendChild(el(`<div class="emptyState">لا توجد نشرات محفوظة بعد. ابدأ بإنشاء أول إصدار من هذا الأسبوع.</div>`));
  } else {
    issues.slice(0,5).forEach(iss=>{
      const row = el(`<div class="issueRow">
        <div class="meta"><div class="badge">${esc(iss.meta.week||'?')}</div>
          <div class="txt"><strong>${esc(iss.meta.title || ('العدد رقم '+iss.meta.week))}</strong><span>${esc(iss.meta.date||'')} · ${esc(iss.meta.term||'')}</span></div>
        </div>
        <button class="miniBtn">فتح</button>
      </div>`);
      row.querySelector('button').addEventListener('click', ()=>{ DB.currentIssue = iss; DB.view='viewer'; render(); window.scrollTo(0,0); });
      list.appendChild(row);
    });
  }
  return wrap;
}

function shorten(s,n){ if(!s) return ""; return s.length>n ? s.slice(0,n)+"…" : s; }

const FONT_CHOICES = {
  display: ['Aref Ruqaa','Amiri','Rakkas','Lalezar','El Messiri'],
  body: ['Tajawal','Cairo','Markazi Text']
};

function renderSettings(){
  const wrap = el(`<div class="wrap" style="max-width:640px;">
    <div class="sectionHead"><h2>الإعدادات</h2><div class="eyebrow">Admin Settings</div></div>

    <div class="panel">
      <h3>الرقم السري للإدارة</h3>
      <div class="field"><label>رقم سري جديد</label><input type="password" id="newPin" placeholder="••••" inputmode="numeric"></div>
      <div class="field"><label>تأكيد الرقم السري</label><input type="password" id="newPin2" placeholder="••••" inputmode="numeric"></div>
      <button class="btnGold" id="savePinBtn" style="margin-top:14px;">حفظ الرقم السري</button>
      <div id="pinSaveMsg" style="display:none;margin-top:10px;font-family:'Cairo',sans-serif;font-size:.8rem;color:#2a6;"></div>
    </div>

    <div class="panel">
      <h3>خط النشرة</h3>
      <div class="hint" style="font-family:'Cairo',sans-serif;font-size:.8rem;color:#887;margin-bottom:16px;">يُطبَّق على جميع النشرات، الحالية والقادمة، لكل الزوار.</div>
      <div class="grid2">
        <div class="field"><label>خط العناوين</label>
          <select id="fontDisplay">${FONT_CHOICES.display.map(f=>`<option value="${f}">${f}</option>`).join('')}</select>
        </div>
        <div class="field"><label>خط النص</label>
          <select id="fontBody">${FONT_CHOICES.body.map(f=>`<option value="${f}">${f}</option>`).join('')}</select>
        </div>
      </div>
      <div id="fontPreview" style="margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:3px;background:var(--paper);">
        <div style="font-family:var(--font-display);font-size:1.4rem;color:var(--navy);margin-bottom:6px;">عنوان تجريبي للنشرة</div>
        <div style="font-family:var(--font-body);font-size:.92rem;color:#554;">هذا نص تجريبي لمعاينة شكل الخط المختار قبل الحفظ.</div>
      </div>
      <button class="btnGold" id="saveFontBtn" style="margin-top:16px;">حفظ الخط</button>
      <div id="fontSaveMsg" style="display:none;margin-top:10px;font-family:'Cairo',sans-serif;font-size:.8rem;color:#2a6;"></div>
    </div>
  </div>`);

  getFontPref().then(pref=>{
    wrap.querySelector('#fontDisplay').value = pref.display;
    wrap.querySelector('#fontBody').value = pref.body;
  });

  const preview = ()=>{
    const d = wrap.querySelector('#fontDisplay').value;
    const b = wrap.querySelector('#fontBody').value;
    const box = wrap.querySelector('#fontPreview');
    box.children[0].style.fontFamily = `'${d}'`;
    box.children[1].style.fontFamily = `'${b}'`;
  };
  wrap.querySelector('#fontDisplay').addEventListener('change', preview);
  wrap.querySelector('#fontBody').addEventListener('change', preview);

  wrap.querySelector('#savePinBtn').addEventListener('click', async ()=>{
    const p1 = wrap.querySelector('#newPin').value.trim();
    const p2 = wrap.querySelector('#newPin2').value.trim();
    const msg = wrap.querySelector('#pinSaveMsg');
    if(!p1 || p1.length < 4){ msg.style.color='#a55'; msg.textContent='الرقم السري يجب ألا يقل عن 4 خانات'; msg.style.display='block'; return; }
    if(p1 !== p2){ msg.style.color='#a55'; msg.textContent='الرقمان غير متطابقين'; msg.style.display='block'; return; }
    await setAdminPin(p1);
    msg.style.color='#2a6'; msg.textContent='تم الحفظ بنجاح'; msg.style.display='block';
    wrap.querySelector('#newPin').value=''; wrap.querySelector('#newPin2').value='';
  });

  wrap.querySelector('#saveFontBtn').addEventListener('click', async ()=>{
    const pref = { display: wrap.querySelector('#fontDisplay').value, body: wrap.querySelector('#fontBody').value };
    await setFontPref(pref);
    const msg = wrap.querySelector('#fontSaveMsg');
    msg.style.display='block'; msg.textContent='تم حفظ الخط وتطبيقه على كل النشرات';
  });

  return wrap;
}

  const grid = wrap.querySelector('#agrid');

  DB.issues.forEach(iss=>{
    const isDraft = iss.status === 'draft';
    const c = el(`<div class="archiveCard">
      <div class="ah">${esc(iss.meta.title || ('العدد '+iss.meta.week))}</div>
      <div class="ab"><strong>الأسبوع ${esc(iss.meta.week)}</strong><span>${esc(iss.meta.date||'')} · مزاج العدد: ${esc(iss.ai?.issueMeta?.mood||'—')}</span>

/* ============================================================
   WIZARD
   ============================================================ */
const WIZARD_STEPS = [
  {key:'meta', label:'معلومات الإصدار'},
  {key:'hod', label:'كلمة رئيس القسم'},
  {key:'news', label:'أخبار القسم'},
  {key:'achievements', label:'الإنجازات'},
  {key:'spotlight', label:'معلم وطالب الأسبوع'},
  {key:'story', label:'ركن الإبداع الأدبي'},
  {key:'initiatives', label:'المبادرات والزوايا'},
  {key:'closing', label:'اللمسات الأخيرة'},
];

function renderWizard(){
  if(!DB.draft) DB.draft = freshDraft();
  const wrap = el(`<div class="wrap wizardShell">
    <div class="sectionHead"><h2>إنشاء نشرة جديدة</h2><div class="eyebrow">New Issue</div></div>
    <div class="stepTrack" id="stepTrack"></div>
    <div id="stepBody"></div>
  </div>`);
  const track = wrap.querySelector('#stepTrack');
  WIZARD_STEPS.forEach((s,i)=>{
    const d = el(`<div class="stepDot ${i<DB.wizardStep?'done':i===DB.wizardStep?'now':''}"><i>${i<DB.wizardStep?'✓':i+1}</i><span>${s.label}</span></div>`);
    track.appendChild(d);
  });
  const body = wrap.querySelector('#stepBody');
  body.appendChild(renderWizardStep(DB.wizardStep));
  return wrap;
}

function stepNav(container, {back, next, nextLabel, onNext}){
  const nav = el(`<div class="wNav">
    <button class="btnGhost" ${back?'':'disabled style="visibility:hidden"'}>السابق</button>
    <button class="btnGold ${DB.wizardStep===WIZARD_STEPS.length-1?'final':''}">${nextLabel||'التالي'}</button>
  </div>`);
  nav.children[0].addEventListener('click', ()=>{ DB.wizardStep--; render(); });
  nav.children[1].addEventListener('click', ()=>{ if(onNext) onNext(); });
  container.appendChild(nav);
}

function renderWizardStep(i){
  const d = DB.draft;
  const step = WIZARD_STEPS[i];
  const box = el(`<div class="wStep"></div>`);

  if(step.key === 'meta'){
    box.appendChild(el(`<h3>معلومات الإصدار</h3><div class="hint">البيانات الأساسية لهذا العدد — لا حاجة لاختيار تصميم أو ألوان، المحرك يتولى ذلك.</div>`));
    const form = el(`<div>
      <div class="grid2">
        <div class="field"><label>عنوان الإصدار (اختياري)</label><input id="f_title" placeholder="مثال: نشرة قسم اللغة العربية" value="${esc(d.meta.title)}"></div>
        <div class="field"><label>الأسبوع</label><input id="f_week" placeholder="مثال: 14" value="${esc(d.meta.week)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${esc(d.meta.date)}"></div>
        <div class="field"><label>الفصل الدراسي</label>
          <select id="f_term">
            ${['الفصل الأول','الفصل الثاني','الفصل الثالث'].map(t=>`<option ${d.meta.term===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field" style="display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);padding:12px 14px;border-radius:2px;">
        <img src="${SHIELD_SRC}" style="height:34px;">
        <span style="font-family:'Cairo',sans-serif;font-size:.76rem;color:#776;">شعار GEMS Founders School مثبّت تلقائيًا كهوية دائمة لكل إصدار — لا حاجة لرفعه.</span>
      </div>
    </div>`);
    box.appendChild(form);
    stepNav(box, {back:false, onNext:()=>{
      d.meta.title = box.querySelector('#f_title').value;
      d.meta.week = box.querySelector('#f_week').value;
      d.meta.date = box.querySelector('#f_date').value;
      d.meta.term = box.querySelector('#f_term').value;
      DB.wizardStep++; render();
    }});
  }

  else if(step.key === 'hod'){
    box.appendChild(el(`<h3>كلمة رئيس القسم</h3><div class="hint">لا داعي لكتابة المقال — فقط فكرة من سطرين أو ثلاثة، وسيحوّلها المحرك إلى افتتاحية صحفية احترافية مع اقتباس بارز.</div>`));
    box.appendChild(el(`<div class="field"><textarea id="f_hod" rows="4" placeholder="مثال: سعدنا هذا الأسبوع بارتفاع مستوى القراءة لدى الطلاب ومشاركتهم في عدد من المبادرات...">${esc(d.hodWord)}</textarea></div>`));
    const photoField = el(`<div class="field"><label>صورة رئيس القسم (اختياري)</label>
      <div class="imgPick">
        <div class="prev ${d.hodImage?'':'none'}" id="hodImgPrev">${d.hodImage?`<img src="${d.hodImage}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;">`:'صورة'}</div>
        <label class="fileLabel">رفع صورة<input type="file" id="f_hodimg" accept="image/*"></label>
      </div>
    </div>`);
    box.appendChild(photoField);
    photoField.querySelector('#f_hodimg').addEventListener('change', async e=>{
      if(e.target.files[0]){
        d.hodImage = await compressImage(e.target.files[0]);
        const prev = photoField.querySelector('#hodImgPrev');
        prev.classList.remove('none');
        prev.innerHTML = `<img src="${d.hodImage}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;">`;
      }
    });
    stepNav(box, {back:true, onNext:()=>{ d.hodWord = box.querySelector('#f_hod').value; DB.wizardStep++; render(); }});
  }

  else if(step.key === 'news'){
    box.appendChild(el(`<h3>أخبار القسم</h3><div class="hint">اكتب نقاطًا مختصرة فقط — سيحوّلها المحرك إلى أخبار صحفية كاملة.</div>`));
    const lb = el(`<div class="listBuilder" id="newsList"></div>`);
    box.appendChild(lb);
    box.appendChild(el(`<button class="addBtn" id="addNews">+ إضافة خبر</button>`));
    renderTextList(lb, d.news, 'مثال: زيارة صفية لمرحلة الروضة');
    box.querySelector('#addNews').addEventListener('click', ()=>{ d.news.push(""); renderWizard_refresh(box, lb, d.news); });
    stepNav(box, {back:true, onNext:()=>{ syncTextList(lb, d.news); d.news = d.news.filter(x=>x.trim()); if(!d.news.length) d.news=[""]; DB.wizardStep++; render(); }});
  }

  else if(step.key === 'achievements'){
    box.appendChild(el(`<h3>إنجازات القسم وإنجازات الطلاب</h3><div class="hint">أدخل الإنجاز فقط (وصورة إن وجدت) — سيتولى المحرك كتابة الخبر وتصميمه.</div>`));
    box.appendChild(el(`<h4 style="font-family:'Cairo',sans-serif;font-size:.85rem;color:var(--navy);margin-top:6px;">إنجازات القسم</h4>`));
    const da = el(`<div id="deptAch"></div>`); box.appendChild(da);
    box.appendChild(el(`<button class="addBtn" id="addDeptAch">+ إضافة إنجاز</button>`));
    renderDeptAchList(da, d.deptAchievements);
    box.querySelector('#addDeptAch').addEventListener('click', ()=>{ d.deptAchievements.push({text:"",img:null}); renderDeptAchList(da, d.deptAchievements); });

function renderTextList(container, arr, placeholder){
  container.innerHTML = "";
  arr.forEach((val,idx)=>{
    const row = el(`<div class="rowItem"><input value="${esc(val)}" placeholder="${placeholder}"><button class="xBtn">×</button></div>`);
    row.querySelector('input').addEventListener('input', e=> arr[idx]=e.target.value);
    row.querySelector('button').addEventListener('click', ()=>{ arr.splice(idx,1); if(!arr.length) arr.push(""); renderTextList(container, arr, placeholder); });
    container.appendChild(row);
  });
}
function syncTextList(container, arr){
  const inputs = container.querySelectorAll('input');
  inputs.forEach((inp,idx)=> arr[idx]=inp.value);
}
function renderWizard_refresh(box, listEl, arr){ renderTextList(listEl, arr, listEl.id==='calList' ? 'مثال: اجتماع أولياء الأمور - الأربعاء':'مثال: زيارة صفية لمرحلة الروضة'); }

function renderPersonBlock(title, person, key, box){
  const block = el(`<div class="personBlock">
    <div class="field" style="margin-top:0;"><label style="color:var(--navy);font-size:.85rem;">${title}</label></div>
    <div class="grid2">
      <div class="field"><label>الاسم</label><input id="${key}_name" value="${esc(person.name)}"></div>
      <div class="field"><label>سبب الاختيار</label><input id="${key}_reason" value="${esc(person.reason)}"></div>
    </div>
    <div class="imgPick">
      <div class="prev ${person.img?'':'none'}">${person.img?`<img src="${person.img}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;">`:'صورة'}</div>
      <label class="fileLabel">رفع الصورة<input type="file" accept="image/*" id="${key}_file"></label>
    </div>
  </div>`);
  block.querySelector(`#${key}_file`).addEventListener('change', async e=>{
    if(e.target.files[0]){
      const img64 = await compressImage(e.target.files[0]);
      // persist all four text fields (both people) before re-rendering the step
      const tn = box.querySelector('#teacher_name'), tr = box.querySelector('#teacher_reason');
      const sn = box.querySelector('#student_name'), sr = box.querySelector('#student_reason');
      if(tn) DB.draft.teacherOfWeek.name = tn.value;
      if(tr) DB.draft.teacherOfWeek.reason = tr.value;
      if(sn) DB.draft.studentOfWeek.name = sn.value;
      if(sr) DB.draft.studentOfWeek.reason = sr.value;
      person.img = img64;
      render();
    }
  });
  return block;
}

/* ============================================================
   AI GENERATION
   ============================================================ */
const LOADING_STAGES = [
  "محرك التخطيط التحريري يحلل المحتوى…",
  "يقرر الغلاف والمزاج العام للعدد…",
  "محرك الكتابة الصحفية يصوغ النصوص…",
  "محرك التصميم يبني تخطيطًا جديدًا لهذا العدد…",
  "توحيد الصور وتطبيق الهوية البصرية…",
  "اللمسات الأخيرة قبل النشر…"
];

async function startGeneration(draft){
  const overlay = el(`<div class="genOverlay"><div class="ring"></div><div class="msg" id="genMsg">${LOADING_STAGES[0]}</div><div class="sub">AI EDITORIAL PIPELINE</div></div>`);
  document.getElementById('app').appendChild(overlay);
  let stageIdx = 0;
  const msgEl = overlay.querySelector('#genMsg');
  const interval = setInterval(()=>{ stageIdx = (stageIdx+1) % LOADING_STAGES.length; msgEl.textContent = LOADING_STAGES[stageIdx]; }, 1400);

  try{
    const ai = await callEditorialEngine(draft, (attempt, max)=>{
      overlay.querySelector('.sub').textContent = `محاولة إعادة اتصال تلقائية (${attempt+1}/${max})…`;
    });
    clearInterval(interval);
    const issue = buildIssueRecord(draft, ai);
    DB.issues.unshift(issue);
    await saveIssue(issue);
    overlay.remove();
    DB.currentIssue = issue;
    DB.view = "viewer";
    render();
    window.scrollTo(0,0);
  }catch(err){
    clearInterval(interval);
    console.error(err);
    overlay.querySelector('.ring').style.borderTopColor = '#c0524f';
    msgEl.textContent = "تعذّر الاتصال بمحرك الذكاء الاصطناعي — يمكنك المحاولة مرة أخرى.";
    overlay.querySelector('.sub').textContent = String(err.message||err).slice(0,140);
    const retry = el(`<button class="btnGold" style="margin-top:22px;">إعادة المحاولة</button>`);
    retry.addEventListener('click', ()=>{ overlay.remove(); startGeneration(draft); });
    overlay.appendChild(retry);
    const back = el(`<button class="btnGhost" style="margin-top:12px;background:transparent;color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3);">العودة للنموذج</button>`);
    back.addEventListener('click', ()=>{ overlay.remove(); render(); });
    overlay.appendChild(back);
  }
}

function buildPrompt(d){
  const newsList = d.news.filter(x=>x.trim()).map((n,i)=>`${i+1}. ${n}`).join("\n") || "لا توجد أخبار مدخلة.";
  const deptAch = d.deptAchievements.filter(a=>a.text).map((a,i)=>`${i+1}. ${a.text}`).join("\n") || "لا يوجد.";
  const studAch = d.studentAchievements.filter(a=>a.name).map((a,i)=>`${i+1}. الطالب: ${a.name} — الإنجاز: ${a.text}`).join("\n") || "لا يوجد.";
  const initiatives = d.initiatives.selected.join("، ") || "لا يوجد";
  const calendar = d.calendar.filter(x=>x.trim()).join("، ") || "لا يوجد";

  return `أنت فريق تحرير متكامل (مدير تحرير + كاتب صحفي عربي محترف + مخطط محتوى) لمجلة أسبوعية رقمية فاخرة لقسم اللغة العربية في مدرسة GEMS Founders School بدبي. القارئ يشمل الطلاب وأولياء الأمور والإدارة، لذا يجب أن تكون اللغة عربية فصحى قوية وأسلوبًا صحفيًا احترافيًا مؤثرًا، لا مجرد إعادة صياغة للمدخلات.

معطيات هذا العدد:
- عنوان الإصدار المقترح من رئيس القسم: ${d.meta.title || "(لم يُحدد — اقترح عنوانًا)"}
- الأسبوع: ${d.meta.week || "غير محدد"} — الفصل: ${d.meta.term}
- فكرة كلمة رئيس القسم (سطرين إلى ثلاثة فقط): "${d.hodWord || "لا يوجد نص — اكتب افتتاحية عامة مناسبة لروح القسم."}"
- أخبار القسم (نقاط خام):
${newsList}
- إنجازات القسم (نقاط خام):
${deptAch}
- إنجازات الطلاب (نقاط خام):
${studAch}
- معلم الأسبوع: الاسم: ${d.teacherOfWeek.name || "—"} — سبب الاختيار: ${d.teacherOfWeek.reason || "—"}
- طالب الأسبوع: الاسم: ${d.studentOfWeek.name || "—"} — سبب الاختيار: ${d.studentOfWeek.reason || "—"}

- فكرة المقال الأسبوعي: ${d.weeklyArticleIdea || "اقترح موضوعًا لغويًا مناسبًا"}
- نصيحة لغوية (خام): ${d.languageTip || "اقترح نصيحة"}
- معلومة لغوية (خام): ${d.languageFact || "اقترح معلومة"}
- سؤال الأسبوع (خام): ${d.weeklyQuestion || "اقترح سؤالًا"}
- تحدي الأسبوع (خام): ${d.weeklyChallenge || "اقترح تحديًا"}
- اقتباس الأسبوع (خام أو فكرة): ${d.weeklyQuoteRaw || "اقترح اقتباسًا مناسبًا لروح العدد"}
- مواعيد الأسبوع القادم: ${calendar}

قبل الكتابة، اتخذ قرار "محرك التخطيط التحريري": حدد ما هو أهم خبر يستحق الغلاف، وما المشاعر التي يجب أن يشعر بها القارئ، وحدد مزاج العدد العام (اختر واحدًا فقط بالضبط): "رسمي" أو "شبابي" أو "احتفالي" أو "إبداعي" — بناءً على طبيعة المحتوى المُدخل فعليًا.

{

/* Extracts the first balanced top-level {...} object from a string,
   honoring string literals/escapes so braces inside quoted text don't
   confuse the boundary — far more reliable than a greedy regex when the
   model adds notes before/after the JSON. */
function extractJSONObject(text){
  const start = text.indexOf('{');
  if(start === -1) return null;
  let depth = 0, inString = false, escape = false;
  for(let i=start; i<text.length; i++){
    const ch = text[i];
    if(escape){ escape = false; continue; }
    if(ch === '\\'){ escape = true; continue; }
    if(ch === '"'){ inString = !inString; continue; }
    if(inString) continue;
    if(ch === '{') depth++;
    else if(ch === '}'){
      depth--;
      if(depth === 0) return text.slice(start, i+1);
    }
  }
  return null; // never closed — truncated response
}

async function callEditorialEngineOnce(prompt){
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ prompt })
  });
  if(!response.ok){
    let detail = "";
    try{ detail = (await response.text()).slice(0,200); }catch(e){}
    throw new Error("فشل الاتصال بواجهة الذكاء الاصطناعي (HTTP "+response.status+")" + (detail?" — "+detail:""));
  }
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||"").join("\n").trim();
  const clean = text.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();

  // 1) try a direct parse first (fastest path when the model behaves)
  try{ return JSON.parse(clean); }catch(e){ /* fall through */ }

  // 2) extract the balanced {...} object regardless of leading/trailing prose
  const extracted = extractJSONObject(clean);
  if(extracted){
    try{ return JSON.parse(extracted); }
    catch(e){
      throw new Error("تعذّر تحليل استجابة الذكاء الاصطناعي (JSON غير صالح حتى بعد الاستخلاص) — " + String(e.message||e));
    }
  }
  throw new Error("تعذّر قراءة استجابة الذكاء الاصطناعي — لم يُعثر على كائن JSON صالح في الرد");
}

async function callEditorialEngine(draft, onRetry){
  const prompt = buildPrompt(draft);
  const MAX_ATTEMPTS = 3;
  let lastErr;
  for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
    try{
      return await callEditorialEngineOnce(prompt);
    }catch(err){
      lastErr = err;
      const isLikelyTransient = /Internal server error|HTTP 5|network|fetch|تعذّر تحليل|تعذّر قراءة/i.test(String(err.message||err));
      if(attempt < MAX_ATTEMPTS && isLikelyTransient){
        if(onRetry) onRetry(attempt, MAX_ATTEMPTS);
        await new Promise(r=> setTimeout(r, 900*attempt));
        continue;
      }
      throw lastErr;
    }
  }
  throw lastErr;
}

function buildIssueRecord(draft, ai){
  const week = draft.meta.week || "1";
  const seed = hashSeed(String(week) + (ai.issueMeta?.mood||"") + (draft.meta.date||""));
  return {
    id: uid(),
    meta: {...draft.meta},
    draft: draft,
    ai: ai,
    seed: seed,
    status: 'draft',
    stats: { readers: Math.floor(80 + (seed%140)) },
    createdAt: new Date().toISOString()
  };
}

function makeTile(innerHTML, {cls='', seq=0, wide=false}={}){
  return el(`<div class="tile ${wide?'wide':''} ${cls} reveal" data-seq="${seq}">${innerHTML}</div>`);

/* ---------- build the full tile list from an issue ---------- */
function extractVideoEmbed(url){
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return { platform:'youtube', id: yt[1], thumb: `https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`, embed: `https://www.youtube.com/embed/${yt[1]}?autoplay=1&rel=0` };
  const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(vm) return { platform:'vimeo', id: vm[1], thumb: null, embed: `https://player.vimeo.com/video/${vm[1]}?autoplay=1` };
  return null;
}

function buildVideoTile(videoUrl, videoTitle, seq){
  const info = extractVideoEmbed(videoUrl);
  const title = videoTitle || 'فيديو الأسبوع';

  if(!info){
    // Unknown platform — plain link card, opens in a new tab
    return makeTile(`
      <div class="tileBody">
        <span class="pill">🎬 فيديو الأسبوع</span>
        <h4>${esc(title)}</h4>
        <a href="${esc(videoUrl)}" target="_blank" rel="noopener" style="color:var(--navy-2);font-size:.82rem;word-break:break-all;">${esc(videoUrl)}</a>
      </div>`,
      {wide:true, seq});
  }

  const thumbHtml = info.thumb
    ? `<img src="${info.thumb}" style="width:100%;height:100%;object-fit:cover;">`
    : `<div style="width:100%;height:100%;background:var(--navy-2);"></div>`;

  const tile = makeTile(`
    <span class="pill" style="margin:14px 0 0 16px;">🎬 فيديو الأسبوع</span>
    <div class="videoFrame" style="margin-top:8px;">
      ${thumbHtml}
      <button class="videoPlayBtn" aria-label="تشغيل">▶</button>
    </div>
    <div class="tileBody" style="padding-top:8px;"><h4>${esc(title)}</h4></div>`,
    {cls:'videoTile', wide:true, seq});

  const frame = tile.querySelector('.videoFrame');
  frame.addEventListener('click', ()=>{
    frame.innerHTML = `<iframe src="${info.embed}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:100%;"></iframe>`;
  }, {once:true});

  return tile;
}

function buildTiles(issue){

    </div>`, {wide:true, seq:seq++}));

    tiles.push(makeTile(feedRowHTML(null, 'خبر', n.headline, n.body), {cls:'feedRow', seq:seq++}));
  });

  // Achievements (dept + student) — thumbnail only if a real photo was uploaded
  (ai.deptAchievements||[]).forEach((a,i)=>{
    const img = d.deptAchievements[i]?.img;
    tiles.push(makeTile(feedRowHTML(img, 'إنجاز القسم', a.headline, a.body), {cls:'feedRow', seq:seq++}));
  });
  (ai.studentAchievements||[]).forEach((a,i)=>{

    tiles.push(makeTile(feedRowHTML(img, 'إبداع طلابي', `${a.name||''} — ${a.headline||''}`, a.body), {cls:'feedRow', seq:seq++}));
  });

  // Spotlight — teacher & student of the week (paired side by side in the two columns)
  ['teacherOfWeek','studentOfWeek'].forEach(key=>{
    const data = ai[key];
    if(!data || (!data.headline && !data.body)) return;
    const label = key==='teacherOfWeek' ? 'معلم الأسبوع' : 'طالب الأسبوع';
    const img = d[key]?.img;
    tiles.push(makeTile(`
      <div class="frame">${img?`<img src="${img}">`:''}</div>
      <div class="personInfo">
        <div class="nm">${esc(label)}</div>
        <h4>${esc(d[key]?.name || data.headline || '')}</h4>
        <p>${esc(data.body||'')}</p>
      </div>`,
      {cls:'circlePerson', seq:seq++}));

  // Student creative-writing stories — excerpt + QR "continue reading" — feature card
  (d.studentStories||[]).filter(s=>s.text && s.text.trim()).forEach((s,i)=>{
    const words = s.text.trim().split(/\s+/);
    const excerpt = words.slice(0,40).join(' ') + (words.length>40 ? ' …' : '');
    const storyUrl = `${location.origin}${location.pathname}#story=${issue.id}:${i}`;
    const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(storyUrl)}`;
    tiles.push(makeTile(`
      <span class="pill" style="margin:14px 0 0 16px;">✒ ركن الإبداع الأدبي</span>
      <div class="sRow">
        ${s.img?`<div class="sImg"><img src="${s.img}"></div>`:''}
        <div class="sBody">
          <h4>${esc(s.title||'بلا عنوان')}</h4>
          <div class="byline">${esc(s.author||'')}${s.grade?' — '+esc(s.grade):''}</div>
          <p>${esc(excerpt)}</p>
        </div>
        <div class="qrBox">
          <img src="${qrSrc}" alt="QR" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <a href="${storyUrl}" target="_blank" rel="noopener" class="qrFallback" style="display:none;">🔗<br>افتح الرابط</a>
          <span>لمتابعة القراءة كاملة</span>
        </div>
      </div>`,
      {cls:'storyTile', wide:true, seq:seq++}));
  });

  // Quote of the week
  if(ai.weeklyQuote?.text){
    tiles.push(makeTile(`
      <div class="bigQ">”</div>
      <q>${esc(ai.weeklyQuote.text)}</q>
      ${ai.weeklyQuote.attribution?`<div class="attr">— ${esc(ai.weeklyQuote.attribution)}</div>`:''}`,
      {cls:'quoteTile', seq:seq++}));
  }

  // Weekly article — feature card (long-form), spans both columns
  if(ai.weeklyArticle?.body){
    tiles.push(makeTile(`
      <div class="tileBody"><span class="pill">📰 المقال الأسبوعي</span><h4>${esc(ai.weeklyArticle.headline||'')}</h4><p>${esc(ai.weeklyArticle.body)}</p></div>`,
      {wide:true, seq:seq++}));
  }

  // Language corner — compact rows
  const lc = ai.languageCorner || {};
  if(lc.tipBody) tiles.push(makeTile(`<div class="fi">✎</div><div class="tileBody"><h4 style="font-size:.85rem;">${esc(lc.tipHeadline||'نصيحة لغوية')}</h4><p>${esc(lc.tipBody)}</p></div>`, {cls:'factTile', seq:seq++}));
  if(lc.factBody) tiles.push(makeTile(`<div class="fi">✺</div><div class="tileBody"><h4 style="font-size:.85rem;">${esc(lc.factHeadline||'معلومة لغوية')}</h4><p>${esc(lc.factBody)}</p></div>`, {cls:'factTile', seq:seq++}));
  if(ai.weeklyQuestion) tiles.push(makeTile(`<div class="fi">؟</div><div class="tileBody"><h4 style="font-size:.85rem;">سؤال الأسبوع</h4><p>${esc(ai.weeklyQuestion)}</p></div>`, {cls:'factTile dottedTile', seq:seq++}));
  if(ai.weeklyChallenge) tiles.push(makeTile(`<div class="fi">🔥</div><div class="tileBody"><h4 style="font-size:.85rem;">تحدي الأسبوع</h4><p>${esc(ai.weeklyChallenge)}</p></div>`, {cls:'factTile dottedTile', seq:seq++}));

  // Initiatives — compact rows, no thumbnail (no photo field)
  (ai.initiatives||[]).forEach(it=>{
    tiles.push(makeTile(feedRowHTML(null, 'مبادرة', it.title, it.body), {cls:'feedRow', seq:seq++}));
  });

  // Video of the week — click-to-play, no autoplay until tapped
  if(d.videoUrl){
    tiles.push(buildVideoTile(d.videoUrl, d.videoTitle, seq++));
  }

  // Photos of the week — one compact thumbnail strip, not separate full-width blocks
  if((d.photos||[]).length){
    const thumbs = d.photos.slice(0,6).map(p=>`<div style="width:64px;height:64px;border-radius:6px;overflow:hidden;flex:none;"><img src="${p}" style="width:100%;height:100%;object-fit:cover;"></div>`).join('');
    tiles.push(makeTile(`<div class="tileBody"><span class="pill">📷 صور الأسبوع</span><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">${thumbs}</div></div>`,
      {wide:true, seq:seq++}));
  }

  // Calendar
  if((ai.calendar||[]).length){
    const items = ai.calendar.map(c=>`<div style="padding:4px 0;border-bottom:1px dashed var(--line);font-size:.78rem;color:#554;">${esc(c.title)}</div>`).join('');
    tiles.push(makeTile(`<div class="tileBody"><span class="pill">📅 الأسبوع القادم</span>${items}</div>`,
      {seq:seq++}));
  }

  return tiles;
}

/* ---------- split tiles into exactly 2-3 pages, evenly by count ---------- */
function tileCost(tile){
  const cls = tile.className;
  if(cls.includes('feedRow')) return 1;
  if(cls.includes('factTile')) return 1.1;
  if(cls.includes('circlePerson')) return 1.6;
  if(cls.includes('storyTile') || cls.includes('videoTile')) return 3;
  if(cls.includes('quoteTile')) return 1.8;
  return 2.2; // editorial, weekly article, calendar, photo strip
}

function paginateTiles(tiles, budgetPerPage=9){
  const totalCost = tiles.reduce((s,t)=> s+tileCost(t), 0);
  const pageCount = Math.min(3, Math.max(2, Math.ceil(totalCost / budgetPerPage)));
  const target = totalCost / pageCount;
  const pages = [[]];
  let running = 0;
  tiles.forEach(t=>{
    const cost = tileCost(t);
    if(running >= target && pages.length < pageCount){
      pages.push([]);
      running = 0;
    }
    pages[pages.length-1].push(t);
    running += cost;
  });
  return pages;
}

  const len = (text||'').length;
  return Math.max(min, Math.min(max, Math.round(base + len*perChar)));
}

  </div>`);
  wrap.appendChild(tb);
  tb.querySelector('#printBtn').addEventListener('click', ()=> window.print());
  tb.querySelector('#backBtn').addEventListener('click', ()=>{ DB.view='archive'; render(); });
  if(isAdmin && isDraft){
    tb.querySelector('#publishBtn').addEventListener('click', async ()=>{
      const btn = tb.querySelector('#publishBtn');
      btn.textContent = 'جارٍ النشر…'; btn.disabled = true;
      issue.status = 'published';
      await saveIssue(issue);
      DB.view = 'viewer'; DB.currentIssue = issue;
      render();
    });
  }

  const theme = MOOD_THEME[issue.ai.issueMeta?.mood] || MOOD_THEME['رسمي'];
  const mag = el(`<div class="pagesWrap" style="--accent:${theme.a};--accent-2b:${theme.a2};--accent-3:${theme.a3};"></div>`);
  wrap.appendChild(mag);

  const tiles = buildTiles(issue);
  const pages = paginateTiles(tiles);

  pages.forEach((pageTiles, i)=>{
    const pageEl = el(`<div class="magPage"></div>`);
    pageEl.appendChild(pageHeaderBar(issue, theme, i, pages.length, i===0));
    const grid = el(`<div class="feedGrid"></div>`);
    pageTiles.forEach(t=> grid.appendChild(t));
    pageEl.appendChild(grid);
    if(i === pages.length-1) pageEl.appendChild(renderColophon(issue));
    mag.appendChild(pageEl);
  });

  tb.querySelector('#pdfBtn').addEventListener('click', async ()=>{
    const btn = tb.querySelector('#pdfBtn');
    const orig = btn.textContent; btn.textContent = 'جارٍ التجهيز…'; btn.disabled = true;
    try{ await document.fonts.ready; }catch(e){}
    const opt = {
      margin: 0,
      filename: `نشرة-العدد-${issue.meta.week||''}.pdf`,
      image: { type:'jpeg', quality:0.95 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#F3ECDA', windowWidth:1180 },
      jsPDF: { unit:'mm', format:'a4', orientation:'landscape' },
      pagebreak: { mode:['css'] }
    };
    html2pdf().set(opt).from(mag).save().then(()=>{ btn.textContent = orig; btn.disabled = false; });
  });

  setTimeout(()=> initReveal(wrap), 30);
  return wrap;
}

function renderColophon(issue){
  const distinctCount = 3 + (issue.seed % 3);
  return el(`<div class="pageFooter">
    <img src="${LOGO_SRC}" alt="GEMS Founders School">
    <span>استوديو النشرة الذكي — قسم اللغة العربية · صُمم هذا العدد آليًا (${distinctCount} تخطيطات مختلفة) ولا يتكرر تصميمه في أي عدد آخر</span>
  </div>`);
}

/* ---------- motion reveal controller ---------- */
function initReveal(root){
  const groups = root.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ groups.forEach(g=>g.classList.add('show')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const seq = parseFloat(entry.target.dataset.seq||0);
        entry.target.style.transitionDelay = (seq*0.12)+'s';
        entry.target.classList.add('show');
        io.unobserve(entry.target);
      }
    });
  }, {threshold:0.12});
  groups.forEach(g=> io.observe(g));
}

/* ---------- public story reader (opened via QR, no login) ---------- */
async function renderStoryReader(issueId, storyIdx){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loginScreen"><div class="loginCard"><div class="sub" style="text-align:center;">جارٍ تحميل النص…</div></div></div>`;
  try{
    const r = await safeGet(`${STORAGE_PREFIX}:issue:${issueId}`);
    if(!r) throw new Error('غير موجود');
    const issue = JSON.parse(r.value);
    const story = (issue.draft.studentStories||[])[storyIdx];
    if(!story || !story.text) throw new Error('غير موجود');
    app.innerHTML = '';
    const wrap = el(`<div style="min-height:100vh;background:var(--paper);">
      <div class="topbar"><div class="brandmark"><div class="glyph"><img src="${LOGO_SRC}"></div><div class="txt"><h1>${esc(story.title||'نص إبداعي')}</h1><span>ركن الإبداع الأدبي</span></div></div></div>
      <div class="wrap" style="max-width:680px;">
        <div class="panel" style="text-align:center;">
          ${story.img?`<div style="width:100px;height:100px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid var(--gold);"><img src="${story.img}" style="width:100%;height:100%;object-fit:cover;"></div>`:''}
          <h2 style="color:var(--navy);font-family:var(--font-display),serif;margin-bottom:4px;">${esc(story.title||'')}</h2>
          <div style="font-family:'Cairo',sans-serif;font-size:.8rem;color:#998;margin-bottom:24px;">${esc(story.author||'')}${story.grade?' — '+esc(story.grade):''}</div>
        </div>
        <div class="panel" style="font-family:var(--font-body),sans-serif;font-size:1.05rem;line-height:2.1;color:#332;white-space:pre-wrap;text-align:right;">${esc(story.text)}</div>
      </div>
    </div>`);
    app.appendChild(wrap);
  }catch(e){
    app.innerHTML = `<div class="loginScreen"><div class="loginCard"><h2>تعذّر العثور على النص</h2><div class="sub">قد يكون الرابط قديمًا أو غير صحيح</div></div></div>`;
  }
}

/* ---------- boot ---------- */
document.documentElement.style.setProperty('--wm-url', `url("${WATERMARK_SRC}")`);
getFontPref().then(applyFontPref);
const storyMatch = location.hash.match(/^#story=([^:]+):(\d+)$/);
if(storyMatch){
  renderStoryReader(storyMatch[1], parseInt(storyMatch[2]));
} else {
  render();
}
</script>
