name: Run newsletter recovery scan 2
on:
  push:
    paths:
      - '.github/workflows/run-recovery-2.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 10
          curl -fsS --retry 6 --retry-delay 5 'https://newsletter-mu-five.vercel.app/api/recover-issues' -o recovery-result-2.json
          cat recovery-result-2.json
      - run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/run-recovery-2.yml
          git add recovery-result-2.json
          git commit -m "Record second newsletter recovery scan"
          git push
