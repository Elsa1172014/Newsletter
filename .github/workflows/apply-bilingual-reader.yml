name: Apply bilingual reader once

on:
  push:
    paths:
      - '.github/workflows/apply-bilingual-reader.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add language switch only
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'id="readerLangSwitch"' in text:
              raise SystemExit('Reader language switch already exists. No changes made.')
          snippet = Path('.github/bilingual-reader-snippet.html').read_text(encoding='utf-8')
          marker = '</body>'
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one closing body tag. No changes made.')
          updated = text.replace(marker, snippet + '\n' + marker, 1)
          path.write_text(updated, encoding='utf-8')

      - name: Commit only requested change
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-bilingual-reader.yml .github/bilingual-reader-snippet.html
          git add index.html
          git diff --cached --exit-code && exit 0
          git commit -m "Add Arabic English reader switch"
          git push
