name: Visitor opens archive once
on:
  push:
    paths:
      - '.github/workflows/visitor-opens-archive.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); old="  wrap.querySelector(\"#visitorBtn\").addEventListener(\"click\", async ()=>{\\n    DB.role = \\\"visitor\\\";"'
