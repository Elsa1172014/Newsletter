name: Resize newsletter images once

on:
  push:
    paths:
      - '.github/workflows/resize-newsletter-images.yml'

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply only the requested image-size changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_news = ".tile.circlePerson .frame{width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:var(--navy-2);flex:none;margin-bottom:10px;animation:spotlightReveal 1s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.15s;}"
          new_news = ".tile.circlePerson .frame{width:100px;height:100px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);background:var(--navy-2);flex:none;margin-bottom:10px;animation:spotlightReveal 1s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.15s;}"

          old_gallery = "width:130px;height:130px;border-radius:50%;overflow:hidden;flex:none;border:4px solid var(--gold);"
          new_gallery = "width:250px;height:250px;border-radius:50%;overflow:hidden;flex:none;border:4px solid var(--gold);"

          if text.count(old_news) != 1:
              raise SystemExit(f'Expected exactly one newsletter image-size rule, found {text.count(old_news)}. No changes made.')
          if text.count(old_gallery) != 1:
              raise SystemExit(f'Expected exactly one gallery image-size rule, found {text.count(old_gallery)}. No changes made.')

          updated = text.replace(old_news, new_news, 1).replace(old_gallery, new_gallery, 1)
          path.write_text(updated, encoding='utf-8')

      - name: Commit only index.html and remove this one-time workflow
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/resize-newsletter-images.yml
          git add index.html
          git diff --cached --exit-code && exit 0
          git commit -m "Set newsletter images to 100px and gallery images to 250px"
          git push
