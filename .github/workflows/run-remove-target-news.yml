name: Run exact news removal
on:
  push:
    paths:
      - '.github/workflows/run-remove-target-news.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact target removal and capture response
        run: |
          sleep 8
          code=$(curl -sS --retry 3 --retry-delay 3 -o remove-result.json -w '%{http_code}' -X POST 'https://newsletter-mu-five.vercel.app/api/remove-target-news')
          echo "$code" > remove-status.txt
          cat remove-result.json
      - name: Record result and clean workflow
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/run-remove-target-news.yml
          git add remove-result.json remove-status.txt
          git commit -m "Record exact news removal result"
          git push
